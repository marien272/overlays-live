<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Top 4 Donateurs</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Rubik:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: 6px 10px; font-family: 'Rubik', 'Segoe UI', sans-serif; }

  #list { width: 340px; display: flex; flex-direction: column; gap: 6px; }

  .row {
    display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px 0 0;
    background: linear-gradient(90deg, rgba(22,34,78,.86), rgba(34,24,72,.82));
    border-left: 4px solid var(--c);
    transform: skewX(-8deg);
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
  }
  .row > * { transform: skewX(8deg); }
  .row.flash { animation: flash .8s; }

  .pos {
    flex: none; width: 34px; align-self: stretch; display: grid; place-items: center;
    background: var(--c); color: #141a33;
    font: 700 22px 'Oswald', 'Arial Narrow', sans-serif;
    transform: none;
  }
  .r1 { --c: #f4c542; }
  .r2 { --c: #c7d1e0; }
  .r3 { --c: #d28a52; }
  .r4 { --c: #5a8dff; }

  .av {
    flex: none; width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
    background: rgba(255,255,255,.15); display: grid; place-items: center;
    font: 700 15px 'Rubik', sans-serif; color: #fff;
  }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .name {
    flex: 1; min-width: 0; font-size: 17px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .val {
    flex: none; display: flex; align-items: center; gap: 6px;
    font: 600 21px 'Oswald', 'Arial Narrow', sans-serif; color: #fff;
  }
  .val svg { width: 20px; height: 20px; display: block; }

  @keyframes flash { 0% { filter: brightness(1.6); } 100% { filter: none; } }
</style>
</head>
<body>
<div id="list"></div>

<script>
const MODE = 'gifts';
const ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f4c542"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#c9901a" stroke-width="2"/><circle cx="12" cy="12" r="10" fill="none" stroke="#c9901a" stroke-width="1.2"/></svg>';
const params = new URLSearchParams(location.search);
const WS_URL = params.get('ws') || 'ws://localhost:21213/';
const STORE = 'top4_' + MODE;
const RESET_AFTER = (Number(params.get('reset_h')) || 4) * 3600 * 1000;

let scores = {};
let roomLikes = 0;

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (raw && Date.now() - raw.t < RESET_AFTER && !params.has('reset')) {
      scores = raw.s || {};
      roomLikes = raw.rl || 0;
    }
  } catch (e) { scores = {}; }
}

function resetAll() {
  scores = {};
  roomLikes = 0;
  save();
  render();
}

function save() {
  if (params.has('test')) return;
  try { localStorage.setItem(STORE, JSON.stringify({ t: Date.now(), s: scores, rl: roomLikes })); } catch (e) {}
}

function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.0', '') + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1).replace('.0', '') + 'k';
  return n.toLocaleString('fr-FR');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function render(changedId) {
  const top = Object.entries(scores).sort((a, b) => b[1].v - a[1].v).slice(0, 4);
  let html = '';
  top.forEach(([id, u], i) => {
    const initial = esc((u.n || '?').trim().charAt(0).toUpperCase());
    const avatar = u.p
      ? '<img src="' + esc(u.p) + '" onerror="this.parentNode.textContent=\'' + initial + '\'">'
      : initial;
    html += '<div class="row r' + (i + 1) + (id === changedId ? ' flash' : '') + '">' +
            '<div class="pos">' + (i + 1) + '</div>' +
            '<div class="av">' + avatar + '</div>' +
            '<div class="name">' + esc(u.n) + '</div>' +
            '<div class="val">' + fmt(u.v) + ICON + '</div></div>';
  });
  document.getElementById('list').innerHTML = html;
}

function add(d, amount) {
  if (!(amount > 0)) return;
  const u = d.user || {};
  const id = d.uniqueId || u.uniqueId || d.userId || u.userId;
  if (!id) return;
  const prev = scores[id] || { v: 0 };
  scores[id] = {
    v: prev.v + amount,
    n: d.nickname || u.nickname || d.uniqueId || u.uniqueId || prev.n || 'Viewer',
    p: d.profilePictureUrl || u.profilePictureUrl || prev.p || ''
  };
  save();
  const topIds = Object.entries(scores).sort((a, b) => b[1].v - a[1].v).slice(0, 4).map(e => e[0]);
  if (topIds.includes(id)) render(id);
}

function handle(msg) {
  const ev = String(msg.event || '').toLowerCase().replace(/[^a-z]/g, '');
  const d = msg.data || {};
  if (ev === 'streamend' || ev === 'liveend') { resetAll(); return; }
  if (ev === 'like') {
    const t = Number(d.totalLikeCount);
    if (t > 0) {
      if (t < roomLikes * 0.8 && roomLikes - t > 1000) resetAll();
      if (t > roomLikes) { roomLikes = t; save(); }
    }
  }
  if (MODE === 'likes' && ev === 'like') {
    add(d, Number(d.likeCount) || 0);
  }
  if (MODE === 'gifts' && ev === 'gift') {
    if (Number(d.giftType) === 1 && d.repeatEnd === false) return;
    const coins = Number(d.diamondCount) || 0;
    const count = Number(d.repeatCount) || 1;
    add(d, coins * count);
  }
}

function connect() {
  let ws;
  try { ws = new WebSocket(WS_URL); } catch (e) { setTimeout(connect, 3000); return; }
  ws.onclose = () => setTimeout(connect, 3000);
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    handle(msg);
  };
}

function test() {
  const names = ['AnonK4K', 'NinjaDu418', 'xX_Sniper_Xx', 'LamaDoré', 'Zéro.Build', 'TurboTilted'];
  const n = names[Math.floor(Math.random() * names.length)];
  const d = { uniqueId: n.toLowerCase(), nickname: n };
  if (MODE === 'likes') add(d, 5 + Math.floor(Math.random() * 60));
  else add(d, [1, 5, 10, 30, 99, 199][Math.floor(Math.random() * 6)]);
}

load();
render();
if (params.has('test')) setInterval(test, 1200);
connect();
</script>
</body>
</html>
