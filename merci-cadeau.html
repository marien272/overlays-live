<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merci Cadeau</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif; }

  #stage { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; }

  .hello {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    animation: popIn .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  .hello.out { animation: popOut .4s ease-in both; }

  .gif { width: 380px; display: grid; place-items: center; font-size: 160px; line-height: 1; }
  .gif img { width: 380px; height: auto; display: block; border-radius: 18px; border: 3px solid #f4c542; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .gif .wave { display: inline-block; transform-origin: 70% 80%; animation: wave 1s ease-in-out infinite; }

  .msg {
    display: flex; align-items: center; gap: 12px; max-width: 460px;
  }

  .avatar {
    flex: none; width: 52px; height: 52px; border-radius: 50%; overflow: hidden;
    border: 3px solid #f4c542; background: #222842; box-shadow: 0 2px 8px rgba(0,0,0,.6);
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .text { color: #fff; font-size: 24px; font-weight: 800; line-height: 1.2; max-width: 460px; -webkit-text-stroke: 1px #0b0d1a; text-shadow: 0 2px 0 #0b0d1a, 0 0 6px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.6); }
  .text .who { color: #f4c542; display: inline-block; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  .text .gift { display: flex; align-items: center; gap: 6px; font-size: 20px; color: #ffd9e6; }
  .text .gift img { width: 28px; height: 28px; }

  #debug { position: absolute; right: 8px; top: 8px; margin: 0; padding: 8px 12px; border-radius: 8px; font: 600 14px/1.4 Consolas, monospace; color: #fff; background: rgba(0,0,0,.75); display: none; }

  @keyframes popIn { from { opacity: 0; transform: translateY(40px) scale(.7); } to { opacity: 1; transform: none; } }
  @keyframes popOut { to { opacity: 0; transform: translateY(30px) scale(.85); } }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(18deg); } 75% { transform: rotate(-12deg); } }
</style>
</head>

<pre id="debug"></pre>

const MAX_QUEUE = 8;
const MIN_COINS = Number(params.get('min')) || 1;

const stage = document.getElementById('stage');
const debugEl = document.getElementById('debug');
const queue = [];
let busy = false;

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function dbg(line) {
  if (!params.has('debug')) return;
  const lines = debugEl.textContent ? debugEl.textContent.split('\n') : [];
  lines.unshift(new Date().toLocaleTimeString('fr-FR') + '  ' + line);
  debugEl.textContent = lines.slice(0, 12).join('\n');
  debugEl.style.display = 'block';
}

function evName(msg) {
  return String(msg.event || msg.type || msg.eventName || msg.name || '').toLowerCase().replace(/[^a-z]/g, '');
}

function evData(msg) {
  return msg.data || msg.payload || msg;
}

function info(d) {
  const u = d.user || {};
  return {
    id: d.uniqueId || u.uniqueId || d.userId || u.userId || d.nickname || u.nickname,
    name: d.nickname || u.nickname || d.uniqueId || u.uniqueId || 'Viewer',
    pic: d.profilePictureUrl || u.profilePictureUrl || ''
  };
}

function enqueue(p) {
  if (queue.length >= MAX_QUEUE) queue.shift();
  queue.push(p);
  if (!busy) next();
}

function next() {
  const p = queue.shift();
  if (!p) { busy = false; return; }
  busy = true;
  show(p);
}

function show(p) {
  const initial = esc(String(p.name).trim().charAt(0).toUpperCase() || '?');
  const avatar = p.pic
    ? '<img src="' + esc(p.pic) + '" alt="" onerror="this.parentNode.textContent=\'' + initial + '\'">'
    : initial;
  const gif = GIF ? '<img src="' + esc(GIF) + '" alt="">' : '<span class="wave">👋</span>';
  const el = document.createElement('div');
  el.className = 'hello';
  el.innerHTML =
    '<div class="gif">' + gif + '</div>' +
    '<div class="msg"><div class="avatar">' + avatar + '</div>' +
    '<div class="text">Thanks <span class="who">' + esc(p.name) + '</span>!' +
    '<div class="gift">' + (p.giftPic ? '<img src="' + esc(p.giftPic) + '" alt="">' : '') +
    esc(p.gift) + (p.count > 1 ? ' x' + p.count : '') + '</div></div></div>';
  stage.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => { el.remove(); next(); }, 400);
  }, DURATION);
}

function handle(msg) {
  if (!msg || typeof msg !== 'object') return;
  const ev = evName(msg);
  const d = evData(msg);
  const gift = ev === 'gift';
  dbg((ev || '(sans nom)') + (gift ? '  → CADEAU' : ''));
  if (ev === 'streamend' || ev === 'liveend') { queue.length = 0; return; }
  if (!gift) return;
  if (Number(d.giftType) === 1 && d.repeatEnd === false) return;
  const count = Number(d.repeatCount) || 1;
  const coins = (Number(d.diamondCount) || 0) * count;
  if (coins < MIN_COINS && d.diamondCount !== undefined) return;
  const p = info(d);
  const g = d.gift || {};
  p.gift = d.giftName || g.name || d.extendedGiftInfo && d.extendedGiftInfo.name || 'gift';
  p.giftPic = d.giftPictureUrl || (g.image && g.image.url_list && g.image.url_list[0]) || '';
  p.count = count;
  enqueue(p);
}

function connect() {
  let ws;
  try { ws = new WebSocket(WS_URL); } catch (e) { setTimeout(connect, 3000); return; }
  ws.onopen = () => dbg('connecté à TikFinity');
  ws.onclose = () => { dbg('déconnecté'); setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    (Array.isArray(msg) ? msg : [msg]).forEach(handle);
  };
}

const TEST_NAMES = ['AnonK4K', 'NinjaDu418', 'xX_Sniper_Xx', 'LamaDoré', 'Zéro.Build'];
function test() { enqueue({ name: TEST_NAMES[Math.floor(Math.random() * TEST_NAMES.length)], pic: '', gift: ['Rose', 'TikTok', 'Coeur', 'Donut'][Math.floor(Math.random() * 4)], giftPic: '', count: 1 + Math.floor(Math.random() * 10) }); }
if (params.has('test')) { test(); setInterval(test, DURATION + 1500); }
document.addEventListener('click', test);

connect();
</script>
