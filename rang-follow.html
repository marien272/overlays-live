<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rang Follow</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Rubik:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Rubik', 'Segoe UI', sans-serif; }

  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  .card {
    --c: #fff; --c2: #fff;
    position: relative; width: 620px; padding: 40px 30px 34px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background: linear-gradient(180deg, rgba(14,16,30,.92), rgba(8,9,18,.92));
    border: 3px solid var(--c); border-radius: 28px;
    box-shadow: 0 0 40px var(--g55), inset 0 0 60px var(--g18);
    animation: cardIn .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  .card.out { animation: cardOut .45s ease-in both; }

  .label {
    font-family: 'Luckiest Guy', Impact, 'Arial Black', sans-serif; font-size: 30px; letter-spacing: 2px;
    color: #fff; opacity: .85; text-shadow: 0 3px 0 rgba(0,0,0,.6);
  }

  .emblem { position: relative; width: 300px; height: 260px; margin: 6px 0 4px; display: grid; place-items: center; }
  .rays {
    position: absolute; width: 460px; height: 460px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, var(--g45) 0 8deg, transparent 8deg 22deg);
    -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%);
    animation: spin 9s linear infinite, fadeIn .6s .25s both;
  }
  .emblem img {
    position: relative; max-width: 280px; max-height: 250px;
    filter: drop-shadow(0 0 22px var(--c)) drop-shadow(0 8px 10px rgba(0,0,0,.6));
    animation: pop .8s .2s cubic-bezier(.2,1.6,.4,1) both, float 2.4s 1s ease-in-out infinite;
  }

  .user {
    font-family: 'Luckiest Guy', Impact, 'Arial Black', sans-serif; font-size: 54px; line-height: 1.05; color: #fff;
    max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 4px 0 rgba(0,0,0,.7), 0 0 18px rgba(0,0,0,.6);
    animation: up .5s .45s both;
  }
  .rank {
    margin-top: 8px; font-family: 'Luckiest Guy', Impact, 'Arial Black', sans-serif; font-size: 46px; letter-spacing: 1px;
    background: linear-gradient(180deg, var(--c2), var(--c)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.75));
    animation: up .5s .6s both;
  }
  .rank small { font-size: 28px; color: #fff; -webkit-text-fill-color: #fff; opacity: .8; margin-right: 10px; }

  .card.unreal { animation: cardIn .55s cubic-bezier(.2,1.4,.4,1) both, shake .5s .7s; }
  .card.unreal::after {
    content: ''; position: absolute; inset: -3px; border-radius: 28px; pointer-events: none;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%) -200% 0 / 200% 100% no-repeat;
    animation: shine 1.6s .9s ease-in-out 2;
  }

  #status { position: absolute; left: 12px; bottom: 12px; padding: 6px 12px; border-radius: 8px; font: 600 16px 'Rubik', sans-serif; color: #fff; background: rgba(200,30,30,.85); display: none; }

  @keyframes cardIn { from { opacity: 0; transform: translateY(60px) scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes cardOut { to { opacity: 0; transform: translateY(-40px) scale(.85); } }
  @keyframes pop { from { opacity: 0; transform: scale(.2) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } }
  @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  @keyframes shine { to { background-position: 200% 0; } }
</style>
</head>

const params = new URLSearchParams(location.search);
const DURATION = (Number(params.get('duree')) || 6) * 1000;
const WS_URL = params.get('ws') || 'ws://localhost:21213/';
const MAX_QUEUE = 15;

const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const queue = [];
const seen = new Set();
let busy = false;

RANKS.forEach(r => { const i = new Image(); i.src = r.img; });

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function enqueue(name) {
  if (queue.length >= MAX_QUEUE) return;
  queue.push(name);
  if (!busy) next();
}

function next() {
  const name = queue.shift();
  if (name === undefined) { busy = false; return; }
  busy = true;
  show(name);
}

function show(name) {
  const r = RANKS[Math.floor(Math.random() * RANKS.length)];
  const card = document.createElement('div');
  card.className = 'card' + (r.name === 'UNREAL' ? ' unreal' : '');

  card.style.setProperty('--c2', r.c2);
  card.style.setProperty('--g55', rgba(r.c, .55));
  card.style.setProperty('--g45', rgba(r.c, .45));
  card.style.setProperty('--g18', rgba(r.c, .18));
  card.innerHTML =
    '<div class="label">NOUVEAU FOLLOW !</div>' +
    '<div class="emblem"><div class="rays"></div><img src="' + r.img + '" alt=""></div>' +
    '<div class="user">' + esc(name) + '</div>' +
    '<div class="rank"><small>RANG</small>' + r.name + '</div>';
  stage.appendChild(card);
  setTimeout(() => {
    card.classList.add('out');
    setTimeout(() => { card.remove(); next(); }, 450);
  }, DURATION);
}

function isFollow(msg) {
  const ev = String(msg.event || '').toLowerCase();
  if (ev === 'follow') return true;
  if (ev === 'social') {
    const d = msg.data || {};
    return /follow/i.test(String(d.displayType || d.label || ''));
  }
  return false;
}

function userName(d) {
  const u = d.user || {};
  return d.nickname || u.nickname || d.uniqueId || u.uniqueId || 'Viewer';
}

function userId(d) {
  const u = d.user || {};
  return d.uniqueId || u.uniqueId || d.userId || u.userId || userName(d);
}

function connect() {
  let ws;
  try { ws = new WebSocket(WS_URL); } catch (e) { setTimeout(connect, 3000); return; }
  ws.onopen = () => { statusEl.style.display = 'none'; };
  ws.onclose = () => {
    if (params.has('debug')) statusEl.style.display = 'block';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (!isFollow(msg)) return;
    const d = msg.data || {};
    const id = userId(d);
    if (seen.has(id)) return;
    seen.add(id);
    enqueue(userName(d));
  };
}

const TEST_NAMES = ['AnonK4K', 'NinjaDu418', 'xX_Sniper_Xx', 'LamaDoré', 'Zéro.Build', 'TurboTilted'];
function testFollow() { enqueue(TEST_NAMES[Math.floor(Math.random() * TEST_NAMES.length)]); }

if (params.has('test')) { testFollow(); setInterval(testFollow, DURATION + 1500); }
document.addEventListener('click', testFollow);

connect();
</script>
</body>
</html>
